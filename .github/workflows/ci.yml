name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test with Java version ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [11, 21]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          # Use same in Dockerfile
          distribution: "corretto"
          java-version: ${{ matrix.java-version }}
          cache: "maven"

      - name: Maven Compile
        run: mvn compile

      - name: Test with Maven and enforce library coverage
        env:
          TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
        run: |
          chmod +x scripts/*
          make build
          make test

      - name: Upload coverage report
        if: matrix.java-version == 21
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/coverage-badge.json
            coverage/coverage-summary.json
            coverage/jacoco.xml

  android-test:
    name: Android test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build Java library JAR
        run: mvn package -Dmaven.test.skip=true

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-pixel2-api30-atd

      - name: Run Android Tests
        working-directory: android-test
        run: >
          ./gradlew pixel2api30DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

  publish-coverage:
    name: Publish coverage
    needs: test
    # Only pushes to the default branch publish, and only once the GitHub App for
    # the test-coverage repository is configured (COVERAGE_APP_CLIENT_ID variable).
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.COVERAGE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - name: Get a token for the test-coverage repository
        id: coverage-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.COVERAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          owner: aspose-barcode-cloud
          repositories: test-coverage
          permission-contents: write
      - name: Publish to test-coverage
        run: python scripts/publish-coverage.py java
        env:
          COVERAGE_TOKEN: ${{ steps.coverage-token.outputs.token }}
          COVERAGE_APP_SLUG: ${{ steps.coverage-token.outputs.app-slug }}
